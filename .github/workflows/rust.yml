name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-latest:
    name: Test on latest Rust
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Rust Version"
        run: rustc --version

      - name: Setup
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind
          cargo install cargo-valgrind
          
      - name: Run tests
        run: |
          cargo valgrind test
          cargo test
          cargo test --doc
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-latest
          path: target
          retention-days: 14

  test-msrv:
    name: Test on Rust MSRV (1.63.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-valgrind's dependencies no longer build on the MSRV, so install
      # the tool with stable and only use 1.63.0 for building/testing the crate.
      - name: "Select stable toolchain for tooling"
        uses: dtolnay/rust-toolchain@stable

      - name: Setup
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind
          cargo install cargo-valgrind

      # Use stable cargo's MSRV-aware resolver (driven by `rust-version` in
      # Cargo.toml) to pick dependency versions that build on 1.63.0.
      - name: "Generate MSRV-compatible lockfile"
        run: cargo generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@1.63.0

      - name: "Rust Version"
        run: rustc --version

      - name: Run tests
        run: |
          cargo valgrind test --locked
          cargo test --locked
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-msrv
          path: target
          retention-days: 14

  Format:                      
    name: Format - nightly toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v4
    - name: "Select toolchain"
      uses: dtolnay/rust-toolchain@nightly
    - name: "Install rustfmt"
      run: rustup component add rustfmt
    - name: "Check formatting"
      run: cargo +nightly fmt --all -- --check